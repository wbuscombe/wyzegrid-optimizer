name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the pinned Docker base image

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps  # make `optimizer.*` importable for the module boot below

      - name: Unit tests
        run: pytest

      # Boot the dashboard in PHANTOM_MODE with NO .env / credentials in the environment and
      # confirm it serves — proves the demo path never depends on a secret (the .phantom.yml
      # contract). Mirrors the local `PHANTOM_MODE=1 python -m optimizer.web.dashboard` smoke.
      - name: Phantom smoke boot (zero secrets)
        env:
          PHANTOM_MODE: "1"
        run: |
          python -m optimizer.web.dashboard &
          pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5004/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ -z "$ok" ]; then echo "phantom dashboard did not come up"; exit 1; fi
          echo "phantom dashboard booted with zero secrets"
