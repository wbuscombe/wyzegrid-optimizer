[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyzegrid-optimizer"
version = "0.1.0"
description = "Read-only detection-quality analyzer for the WyzeGrid Frigate setup"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.setuptools.packages.find]
where = ["src"]
